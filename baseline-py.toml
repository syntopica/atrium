# baseline-py configuration - https://github.com/BusiRocket/baseline
schema-version = 1
source-roots = ["atrium"]
test-roots = ["tests"]
respect-gitignore = true
# Ratchet: 54.86% measured at adoption (2026-09-01). Raise toward 80, never lower.
coverage-threshold = 54

[limits]
max-file-lines = 150
test-max-file-lines = 300

# A role states what a file is. Prefer a role over a suppression: it explains
# the file instead of silencing an alarm.
[roles]
data = []
registry = []
entrypoint = []
generated = []
namespace-init = []
