# codeality-py configuration - https://github.com/syntopica/codeality
schema-version = 1
source-roots = ["atrium"]
test-roots = ["tests"]
respect-gitignore = true
# Ratchet: 54.86% measured at adoption (2026-09-01). Raise toward 80, never lower.
coverage-threshold = 80

[limits]
max-file-lines = 150
test-max-file-lines = 300

# A role states what a file is. Prefer a role over a suppression: it explains
# the file instead of silencing an alarm.
[roles]
data = ["atrium/embed/model_repo.py", "atrium/session/session_segmentation.py", "atrium/session/stop_limits.py", "atrium/session/record_session_contract.py", "atrium/status/status_schema_version.py", "atrium/context/context_schema_version.py", "atrium/embed/semantic_roles.py", "atrium/store/build_versions.py", "atrium/store/schema.py", "atrium/synthesize/event_id_schema.py", "atrium/synthesize/stopwords.py", "atrium/synthesize/synthesis_prompt.py", "atrium/synthesize/synthesis_schema.py", "atrium/ingest/max_chunk_chars.py", "atrium/synthesize/episode_word.py", "atrium/adapters/max_limit.py", "atrium/adapters/mcp_app.py", "atrium/adapters/served_index.py"]
registry = []
entrypoint = ["atrium/cli.py", "atrium/adapters/mcp_server.py"]
generated = []
namespace-init = []

[[overrides]]
paths = ["atrium/**", "tests/**"]
disable = ["BPY006"]
reason = "atrium is a SQLite index engine; inline SQL in its store and retrieve lanes and their tests is the deliberate style (AGENTS.md, measured decisions)"
