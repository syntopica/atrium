[project]
name = "atrium"
version = "0.1.0"
description = "Local-first memory and knowledge retrieval over a canonical conversation archive"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface_hub>=0.23",
]

[project.scripts]
atrium = "atrium.cli:main"
atrium-mcp = "atrium.adapters.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# The MCP adapter is optional: the core must stay installable, and testable,
# without the protocol SDK. An adapter is never allowed to become the engine.
mcp = ["mcp>=2.1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
