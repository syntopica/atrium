[project]
name = "atrium"
version = "0.1.0"
description = "Local-first memory and knowledge retrieval over a canonical conversation archive"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface_hub>=0.23",
]

[project.scripts]
atrium = "atrium.cli:main"
atrium-mcp = "atrium.adapters.mcp_server:main"

[project.optional-dependencies]
# The MCP adapter is optional: the core must stay installable, and testable,
# without the protocol SDK. An adapter is never allowed to become the engine.
mcp = ["mcp>=2.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "D", "DTZ", "E", "ERA", "F", "I", "N", "PL", "PTH", "RET", "RUF", "S102", "S103", "S104", "S105", "S106", "S107", "S108", "S301", "S302", "S303", "S304", "S305", "S306", "S324", "S501", "S506", "S508", "S509", "S608", "S609", "S612", "SIM", "T20", "UP", "W"]
ignore = ["COM812", "D203", "D206", "D213", "D300", "E111", "E114", "E117", "E501", "ISC001", "W191", "PLC0415", "T201", "D107"]

# Project decisions, not baseline defaults: the CLI lazy-imports its heavy
# model stack on purpose (startup latency), and print is its output channel.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ARG", "PLR2004"]
"**/conftest.py" = ["D"]
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "ARG", "PLR"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["atrium"]

[tool.deptry.per_rule_ignores]
DEP002 = []

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 54

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
quality = [
  "busirocket-baseline-py>=0.1,<1",
  "deptry>=0.20,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.15,<1",
]
